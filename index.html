<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品一覧｜思想・哲学・文学・芸術の会</title>
<meta name="description" content="思想・哲学・文学・芸術の会の文芸同人誌に収録された短編の一覧です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=EB+Garamond:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <header class="site-header">
    <div>
      <p class="org latin" id="org">Association of Religion and Philosophy and Literature and Art.</p>
      <h1 id="page-title">作品一覧</h1>
    </div>
    <nav aria-label="サイト内">
      <a href="#works">作品</a>
      <a href="#issues">収録誌</a>
    </nav>
  </header>

  <section class="filters" aria-label="絞り込み">
    <div class="filter-row">
      <span class="filter-label" id="lbl-issue">収録誌</span>
      <div class="chips" id="issue-chips" role="group" aria-labelledby="lbl-issue"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label" id="lbl-genre">ジャンル</span>
      <div class="chips" id="genre-chips" role="group" aria-labelledby="lbl-genre"></div>
    </div>
  </section>

  <div class="browse">
    <section class="works" id="works" aria-label="作品">
      <p class="count" id="count" aria-live="polite"></p>
      <ul class="grid" id="grid"></ul>
      <p class="empty" id="empty" hidden>この条件に当てはまる作品はまだありません。</p>
    </section>
    <aside class="preview" id="preview" aria-label="選択中の作品"></aside>
  </div>

  <section class="issues" id="issues" aria-labelledby="issues-h">
    <h2 id="issues-h">収録誌</h2>
    <ul class="issue-list" id="issue-list"></ul>
  </section>
</div>
<noscript><p class="page">このページの表示にはJavaScriptが必要です。</p></noscript>
<script src="assets/common.js"></script>
<script src="assets/list.js"></script>
</body>
</html>
